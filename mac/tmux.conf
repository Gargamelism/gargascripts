# enable monitoring
set-window-option -g monitor-activity on
set -g visual-activity on
set-window-option -g window-status-activity-style "fg=red,bold"

# border control
set -g pane-active-border-style "fg=#F283B6,bg=default"
set -g pane-border-lines heavy

# mouse control
set -g mouse on
bind -T copy-mode WheelUpPane send -N1 -X scroll-up
bind -T copy-mode WheelDownPane send -N1 -X scroll-down

# update conf
bind r source-file ~/.tmux.conf
bind R run 'panes=`tmux list-panes -s -F "##{pane_id}"`; for pane in $panes; do tmux send -t $pane "source ~/.zshrc" Enter; done'

# pane name
set -g pane-border-status top
bind-key T command-prompt -p "New pane title:" 'select-pane -T "%%"'

# resize pane
bind -r C-w resize-pane -U 5
bind -r C-s resize-pane -D 5
bind -r C-d resize-pane -R 5
bind -r C-a resize-pane -L 5

# restore sessions - don't forget to install package manager
set -g @plugin 'tmux-plugins/tmux-resurrect'
run '~/.tmux/plugins/tpm/tpm' # must be last
